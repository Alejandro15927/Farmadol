<!doctype html>
<html class="light" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Farmadol ERP - Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/dashboard.css" />
  </head>
  <body class="font-body-md text-on-background" style="font-family: Inter, sans-serif; background-color: #f1f5f9;">
    
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-lg">
            F
          </div>
          <div>
            <h1 class="text-lg font-bold text-gray-800">Farmadol ERP</h1>
            <p class="text-xs text-gray-500">Sistema de Gestión</p>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <!-- Dashboard -->
        <div class="nav-section">
          <span class="nav-section-title">Principal</span>
        </div>
        <a href="#" class="nav-item active" data-module="dashboard">
          <span class="material-symbols-outlined">dashboard</span>
          <span>Dashboard</span>
        </a>

        <!-- Módulos -->
        <div class="nav-section">
          <span class="nav-section-title">Módulos</span>
        </div>

        <a href="#" class="nav-item" data-module="ventas">
          <span class="material-symbols-outlined">shopping_cart</span>
          <span>Ventas</span>
        </a>

        <a href="#" class="nav-item" data-module="inventario">
          <span class="material-symbols-outlined">inventory_2</span>
          <span>Inventario</span>
        </a>

        <a href="#" class="nav-item" data-module="compras">
          <span class="material-symbols-outlined">local_shipping</span>
          <span>Compras</span>
        </a>

        <a href="#" class="nav-item" data-module="clientes">
          <span class="material-symbols-outlined">people</span>
          <span>Clientes</span>
        </a>

        <a href="#" class="nav-item" data-module="sucursales">
          <span class="material-symbols-outlined">storefront</span>
          <span>Sucursales</span>
        </a>

        <a href="#" class="nav-item" data-module="reportes">
          <span class="material-symbols-outlined">assessment</span>
          <span>Reportes</span>
        </a>

        <div class="nav-section mt-auto">
          <span class="nav-section-title">Usuario</span>
        </div>

        <a href="#" class="nav-item" id="logoutBtn">
          <span class="material-symbols-outlined">logout</span>
          <span>Cerrar Sesión</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl">
          <div class="w-9 h-9 bg-blue-600 rounded-full flex items-center justify-center text-white font-semibold" id="userAvatar">
            U
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold text-gray-700 truncate" id="userName">Usuario</p>
            <p class="text-xs text-gray-500 truncate" id="userRole">Cargando...</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Top Bar -->
      <header class="top-bar">
        <div class="flex items-center gap-4">
          <button id="toggleSidebar" class="lg:hidden p-2 hover:bg-gray-100 rounded-lg transition-colors">
            <span class="material-symbols-outlined">menu</span>
          </button>
          <h2 class="text-xl font-semibold text-gray-800" id="pageTitle">Dashboard</h2>
        </div>
        <div class="flex items-center gap-3">
          <button class="p-2 hover:bg-gray-100 rounded-lg transition-colors relative">
            <span class="material-symbols-outlined">notifications</span>
            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
          </button>
          <span class="text-sm text-gray-500" id="currentDateTime"></span>
        </div>
      </header>

      <!-- Content Area -->
      <div class="content-area" id="contentArea">
        <!-- El contenido se carga dinámicamente aquí -->
      </div>
    </main>

    <!-- Scripts - Cargar desde el servidor en puerto 3010 -->
    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/modules/dashboard.js"></script>
    <script src="/js/modules/auth.js"></script>
    <script src="/js/modules/sucursales.js"></script>
    <script src="/js/modules/inventario.js"></script>
    <script src="/js/modules/ventas.js"></script>
    <script src="/js/modules/clientes.js"></script>
    <script src="/js/modules/compras.js"></script>
    <script src="/js/modules/reportes.js"></script>
    <script src="/js/dashboard.js"></script>
  </body>
</html>
