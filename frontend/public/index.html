<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Farmadol ERP - Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8fafc;
      }
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center font-body-md text-on-background" style="font-family: Inter, sans-serif; background-color: #f8fafc;">
    <main class="w-full max-w-[440px] px-4 md:px-0">
      <div class="bg-white border border-gray-200 rounded-xl shadow-lg overflow-hidden">
        <div class="p-6 md:p-10 flex flex-col items-center">
          <div class="mb-6 flex flex-col items-center gap-2">
            <div class="text-center">
              <h1 class="text-2xl font-bold text-gray-800 mt-2">Farmadol ERP</h1>
              <p class="text-gray-500 text-sm mt-1">Please enter your details to sign in</p>
            </div>
          </div>
          
          <div id="alertError" class="w-full mb-4 p-3 bg-red-100 text-red-700 rounded-lg hidden items-center gap-2">
            <span id="errorMessage" class="text-sm">Invalid email or password. Please try again.</span>
          </div>
          
          <form id="loginForm" class="w-full space-y-4">
            <div class="flex flex-col gap-1.5">
              <label class="text-sm font-medium text-gray-700 ml-0.5" for="email">Email Address</label>
              <input
                class="w-full h-12 px-4 bg-white border border-gray-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all"
                id="email"
                name="email"
                placeholder="admin@farmadol.com"
                required=""
                type="email"
                value="admin@farmadol.com"
              />
            </div>
            <div class="flex flex-col gap-1.5">
              <div class="flex justify-between items-center px-0.5">
                <label class="text-sm font-medium text-gray-700" for="password">Password</label>
              </div>
              <div class="relative">
                <input
                  class="w-full h-12 px-4 bg-white border border-gray-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all"
                  id="password"
                  name="password"
                  placeholder="••••••••"
                  required=""
                  type="password"
                  value="admin123"
                />
                <button
                  id="togglePassword"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
                  type="button"
                >
                  👁️
                </button>
              </div>
            </div>
            <button
              id="loginBtn"
              class="w-full h-12 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-2"
              type="submit"
            >
              <span>Sign In</span>
            </button>
          </form>
        </div>
        <div class="bg-gray-50 px-6 py-4 border-t border-gray-200 flex justify-center items-center gap-2">
          <span class="text-xs text-gray-500">© 2026 Farmadol ERP. All rights reserved.</span>
        </div>
      </div>
    </main>

    <!-- Scripts - Ruta correcta desde public/ -->
    <script src="/js/config.js"></script>
    <script>
      // Verificar que config.js se cargó
      if (typeof getApiBase === 'undefined') {
        console.error('❌ config.js no se cargó correctamente');
        document.getElementById('errorMessage').textContent = 'Error de configuración. Recarga la página.';
        document.getElementById('alertError').classList.remove('hidden');
      } else {
        console.log('✅ config.js cargado correctamente');
        console.log('📡 API Base:', getApiBase());
      }

      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const loginBtn = document.getElementById('loginBtn');
      const alertError = document.getElementById('alertError');
      const errorMessage = document.getElementById('errorMessage');
      const togglePassword = document.getElementById('togglePassword');

      togglePassword.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.textContent = type === 'password' ? '👁️' : '🙈';
      });

      function showError(message) {
        errorMessage.textContent = message;
        alertError.classList.remove('hidden');
        setTimeout(() => {
          alertError.classList.add('hidden');
        }, 5000);
      }

      function hideError() {
        alertError.classList.add('hidden');
      }

      async function handleLogin(e) {
        e.preventDefault();
        hideError();
        
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        
        if (!email || !password) {
          showError('Please enter both email and password');
          return;
        }
        
        if (typeof getApiBase === 'undefined') {
          showError('Error de configuración. Recarga la página.');
          return;
        }
        
        const apiBase = getApiBase();
        console.log('🔍 API Base:', apiBase);
        console.log('📤 Enviando login para:', email);
        
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<span>⏳ Signing in...</span>';
        
        try {
          const response = await fetch(`${apiBase}/api/auth/login`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
          });

          console.log('📥 Status:', response.status);
          
          const text = await response.text();
          console.log('📥 Body:', text.substring(0, 200));
          
          const data = parseJsonResponse(text, response.headers.get('Content-Type'));

          if (response.ok && data && data.success) {
            console.log('✅ Login exitoso!');
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            
            window.location.href = '/dashboard.html';
          } else {
            const msg = getLoginErrorMessage(response, data);
            showError(msg);
          }
        } catch (error) {
          console.error('❌ Login error:', error);
          showError(`Error: ${error.message}`);
        } finally {
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<span>Sign In</span>';
        }
      }
      
      form.addEventListener('submit', handleLogin);
    </script>
  </body>
</html>
